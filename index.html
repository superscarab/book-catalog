<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Library — Book Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F2ECD9;
    --drawer: #12201B;
    --drawer-deep: #0C1713;
    --card: #EDE3C8;
    --card-shadow: #00000055;
    --brass: #C9A24B;
    --brass-bright: #E4C36B;
    --muted: #8FA79B;
    --line: #2C3F37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #1A2E27 0%, var(--drawer) 55%, var(--drawer-deep) 100%);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .drawer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    margin: 0 0 4px;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 40px;
    text-align: center;
  }

  .catalog-frame {
    width: 100%;
    max-width: 640px;
  }

  .search-wrap {
    position: relative;
    border: 1px solid var(--brass);
    border-radius: 3px;
    background: var(--drawer-deep);
    box-shadow: inset 0 0 0 1px #00000040, 0 12px 30px -12px #00000090;
  }

  .search-wrap::before {
    content: "No.";
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--brass);
    font-size: 12px;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    padding: 18px 18px 18px 56px;
  }

  #search::placeholder { color: #5C7267; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.03em; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    padding: 0 4px;
    letter-spacing: 0.03em;
  }

  #results {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--card);
    color: #2A2117;
    border-radius: 2px;
    padding: 14px 18px;
    position: relative;
    box-shadow: 0 6px 14px -6px var(--card-shadow);
    border-left: 4px solid var(--brass);
    animation: rise 0.25s ease both;
  }

  .card::after {
    content: "";
    position: absolute;
    top: 10px;
    right: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--drawer);
    box-shadow: inset 0 0 0 1px #00000030;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    padding-right: 24px;
  }

  .card-title mark {
    background: var(--brass-bright);
    color: #2A2117;
    padding: 0 2px;
    border-radius: 1px;
  }

  .card-format {
    display: inline-block;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #6B5A33;
    border: 1px solid #6B5A3355;
    border-radius: 2px;
    padding: 2px 6px;
  }

  .empty-state, .loading-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 40px;
    line-height: 1.7;
  }

  footer {
    margin-top: 56px;
    color: #4E6459;
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

  <div class="drawer-label">Card Catalog</div>
  <h1>Your Library</h1>
  <div class="subtitle" id="subtitle">Loading catalog…</div>

  <div class="catalog-frame">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="type a title to search…" autocomplete="off" autofocus>
    </div>
    <div class="meta-row">
      <span id="resultCount"></span>
      <span id="lastUpdated"></span>
    </div>

    <div id="results"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No matches. Try a shorter or different word.</div>
  </div>

  <footer>Rebuilt nightly at 2:00 AM from your local library.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
  let fuse = null;
  let allBooks = [];
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('emptyState');
  const subtitleEl = document.getElementById('subtitle');
  const countEl = document.getElementById('resultCount');
  const updatedEl = document.getElementById('lastUpdated');
  const searchEl = document.getElementById('search');

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, matches) {
    if (!matches || !matches.length) return escapeHtml(text);
    // Merge indices from all match ranges on the title field
    let ranges = [];
    matches.forEach(m => { if (m.key === 'title') ranges = ranges.concat(m.indices); });
    if (!ranges.length) return escapeHtml(text);
    ranges.sort((a, b) => a[0] - b[0]);
    let out = '';
    let cursor = 0;
    ranges.forEach(([start, end]) => {
      if (start < cursor) return;
      out += escapeHtml(text.slice(cursor, start));
      out += '<mark>' + escapeHtml(text.slice(start, end + 1)) + '</mark>';
      cursor = end + 1;
    });
    out += escapeHtml(text.slice(cursor));
    return out;
  }

  function renderCards(items, isSearch) {
    resultsEl.innerHTML = '';
    if (!items.length) {
      emptyEl.style.display = 'block';
      countEl.textContent = '';
      return;
    }
    emptyEl.style.display = 'none';
    const capped = items.slice(0, 100);
    countEl.textContent = isSearch
      ? `${items.length} match${items.length === 1 ? '' : 'es'}`
      : `${items.length} books total`;

    capped.forEach(res => {
      const book = isSearch ? res.item : res;
      const matches = isSearch ? res.matches : null;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${highlight(book.title, matches)}</div>
        <div class="card-format">${escapeHtml(book.format || '')}</div>
      `;
      resultsEl.appendChild(card);
    });
  }

  function doSearch(query) {
    if (!query.trim()) {
      renderCards(allBooks.slice(0, 30), false);
      return;
    }
    const results = fuse.search(query);
    renderCards(results, true);
  }

  searchEl.addEventListener('input', e => doSearch(e.target.value));

  Promise.all([
    fetch('books.json').then(r => r.json()),
    fetch('meta.json').then(r => r.json()).catch(() => null)
  ]).then(([books, meta]) => {
    allBooks = books;
    fuse = new Fuse(books, {
      keys: ['title'],
      threshold: 0.35,
      ignoreLocation: true,
      includeMatches: true,
      minMatchCharLength: 2
    });
    subtitleEl.textContent = `${books.length} books catalogued`;
    if (meta && meta.lastUpdated) {
      updatedEl.textContent = `updated ${meta.lastUpdated}`;
    }
    renderCards(allBooks.slice(0, 30), false);
  }).catch(err => {
    subtitleEl.textContent = 'Could not load books.json';
    console.error(err);
  });
</script>

</body>
</html>
