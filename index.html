<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Library — Book Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./index_files/css2" rel="stylesheet">
<style>
  :root {
    --ink: #F2ECD9;
    --drawer: #12201B;
    --drawer-deep: #0C1713;
    --card: #EDE3C8;
    --card-shadow: #00000055;
    --brass: #C9A24B;
    --brass-bright: #E4C36B;
    --muted: #8FA79B;
    --line: #2C3F37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #1A2E27 0%, var(--drawer) 55%, var(--drawer-deep) 100%);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .drawer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    margin: 0 0 4px;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 40px;
    text-align: center;
  }

  .catalog-frame {
    width: 100%;
    max-width: 640px;
  }

  .search-wrap {
    position: relative;
    border: 1px solid var(--brass);
    border-radius: 3px;
    background: var(--drawer-deep);
    box-shadow: inset 0 0 0 1px #00000040, 0 12px 30px -12px #00000090;
  }

  .search-wrap::before {
    content: "No.";
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--brass);
    font-size: 12px;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    padding: 18px 18px 18px 56px;
  }

  #search::placeholder { color: #5C7267; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.03em; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    padding: 0 4px;
    letter-spacing: 0.03em;
  }

  #results {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--card);
    color: #2A2117;
    border-radius: 2px;
    padding: 14px 18px;
    position: relative;
    box-shadow: 0 6px 14px -6px var(--card-shadow);
    border-left: 4px solid var(--brass);
    animation: rise 0.25s ease both;
  }

  .card::after {
    content: "";
    position: absolute;
    top: 10px;
    right: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--drawer);
    box-shadow: inset 0 0 0 1px #00000030;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    padding-right: 24px;
  }

  .card-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #6B5A33;
    margin-top: 5px;
    word-break: break-all;
    padding-right: 24px;
  }

  .card-title mark {
    background: var(--brass-bright);
    color: #2A2117;
    padding: 0 2px;
    border-radius: 1px;
  }

  .card-format {
    display: inline-block;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #6B5A33;
    border: 1px solid #6B5A3355;
    border-radius: 2px;
    padding: 2px 6px;
  }

  .empty-state, .loading-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 40px;
    line-height: 1.7;
  }

  footer {
    margin-top: 56px;
    color: #4E6459;
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

  <div class="drawer-label">Card Catalog</div>
  <h1>Your Library</h1>
  <div class="subtitle" id="subtitle">Could not load books.json</div>

  <div class="catalog-frame">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="type a title to search…" autocomplete="off" autofocus="">
    </div>
    <div class="meta-row">
      <span id="resultCount"></span>
      <span id="lastUpdated"></span>
    </div>

    <div id="results"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No matches. Try a shorter or different word.</div>
  </div>

  <footer>Rebuilt nightly at 2:00 AM from your local library.</footer>

<script>
  let allBooks = [];
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('emptyState');
  const subtitleEl = document.getElementById('subtitle');
  const countEl = document.getElementById('resultCount');
  const updatedEl = document.getElementById('lastUpdated');
  const searchEl = document.getElementById('search');

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Highlights each query word only where it appears as the start of a
  // real word in the title (not scattered letters, not mid-word substrings).
  function highlightWords(text, words) {
    const escaped = escapeHtml(text);
    if (!words.length) return escaped;
    const pattern = new RegExp('\\b(' + words.map(escapeRegex).join('|') + ')', 'gi');
    return escaped.replace(pattern, m => '<mark>' + m + '</mark>');
  }

  // A book matches only if EVERY typed word is a whole word (or the start of
  // a word) somewhere in the title - e.g. "dummies" matches "... for Dummies"
  // but never matches on scattered/unrelated letters.
  function matchesQuery(title, words) {
    const lower = title.toLowerCase();
    return words.every(w => new RegExp('\\b' + escapeRegex(w)).test(lower));
  }

  function renderCards(items, isSearch, words) {
    resultsEl.innerHTML = '';
    if (!items.length) {
      emptyEl.style.display = 'block';
      countEl.textContent = '';
      return;
    }
    emptyEl.style.display = 'none';
    const capped = items.slice(0, 100);
    countEl.textContent = isSearch
      ? `${items.length} match${items.length === 1 ? '' : 'es'}`
      : `${items.length} books total`;

    capped.forEach(book => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${highlightWords(book.title, words || [])}</div>
        <div class="card-path">${escapeHtml(book.path || '')}</div>
        <div class="card-format">${escapeHtml(book.format || '')}</div>
      `;
      resultsEl.appendChild(card);
    });
  }

  function doSearch(query) {
    const trimmed = query.trim();
    if (!trimmed) {
      renderCards(allBooks.slice(0, 30), false, []);
      return;
    }
    const words = trimmed.toLowerCase().split(/\s+/).filter(Boolean);
    const matches = allBooks.filter(book => matchesQuery(book.title, words));
    renderCards(matches, true, words);
  }

  searchEl.addEventListener('input', e => doSearch(e.target.value));

  Promise.all([
    fetch('books.json').then(r => r.json()),
    fetch('meta.json').then(r => r.json()).catch(() => null)
  ]).then(([books, meta]) => {
    allBooks = books;
    subtitleEl.textContent = `${books.length} books catalogued`;
    if (meta && meta.lastUpdated) {
      updatedEl.textContent = `updated ${meta.lastUpdated}`;
    }
    renderCards(allBooks.slice(0, 30), false, []);
  }).catch(err => {
    subtitleEl.textContent = 'Could not load books.json';
    console.error(err);
  });
</script>



</body></html>
